name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surveyapi 
          POSTGRES_PASSWORD: surveyapi
          POSTGRES_DB: surveyapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U surveyapi"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python 3.12-slim
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest



